name: Distribute canonical Kolbo skill

# packages/opencode/skills/kolbo is the only editable source. This workflow:
#   1. mirrors it byte-for-byte into the Claude plugin;
#   2. regenerates the public kolbo-skills split package from it;
#      also packs kolbo.zip (Claude.ai / Codex upload) from the same tree;
#   3. mirrors it into @kolbo/mcp, validates the bundle, versions and publishes it;
#   4. updates kolbo-api to the newly published MCP package.
# Never hand-edit any downstream skill tree.

on:
  push:
    branches: [master, main, dev]
    paths:
      - 'packages/opencode/skills/kolbo/**'
      - 'packages/opencode/script/build-split-skills.mjs'
      - 'packages/opencode/script/split-skills/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual re-sync'

concurrency:
  group: kolbo-skill-distribution
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - name: Checkout Claude plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zoharvan12/kolbo-claude-plugin
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: plugin

      - name: Mirror canonical tree to Claude plugin
        run: |
          set -euo pipefail
          SRC=source/packages/opencode/skills/kolbo
          DST=plugin/skills/kolbo
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -R "$SRC"/. "$DST"/
          diff -qr "$SRC" "$DST"

      - name: Detect Claude plugin changes
        id: plugin_changes
        run: |
          set -euo pipefail
          cd plugin
          git add skills/kolbo/
          if git diff --cached --quiet -- skills/kolbo/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version and push Claude plugin
        if: steps.plugin_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd plugin
          MANIFEST=.claude-plugin/plugin.json
          OLD=$(jq -r .version "$MANIFEST")
          NEW=$(echo "$OLD" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
          tmp=$(mktemp)
          jq --arg version "$NEW" '.version = $version' "$MANIFEST" > "$tmp"
          mv "$tmp" "$MANIFEST"
          SHA=$(cd ../source && git rev-parse --short HEAD)
          git config user.name "kolbo-skill-sync[bot]"
          git config user.email "kolbo-skill-sync@users.noreply.github.com"
          git add skills/kolbo/ "$MANIFEST"
          git commit -m "chore(skill): sync canonical skill from kolbo-code@${SHA}"
          git push

      # --- kolbo-skills: the public split-skill package -------------------
      # Same canonical content, regenerated into the 11 slash-command skills
      # that repo publishes. Runs before the MCP release so it is never gated
      # on an npm publish.
      - name: Checkout public skills package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zoharvan12/kolbo-skills
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: skills-pkg

      - name: Set up Node.js for generator
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate split skills from canonical
        run: |
          set -euo pipefail
          cd source/packages/opencode
          node script/build-split-skills.mjs --out "$GITHUB_WORKSPACE/skills-pkg"
          node script/build-split-skills.mjs --check --out "$GITHUB_WORKSPACE/skills-pkg"

      - name: Pack Claude.ai / Codex upload zip
        run: |
          set -euo pipefail
          node source/packages/opencode/script/pack-upload-skill.mjs --out "$GITHUB_WORKSPACE/skills-pkg/kolbo.zip"

      - name: Sync plugin manifests to the generated skill set
        run: |
          set -euo pipefail
          cd skills-pkg
          VERSION=$(cat VERSION)
          SKILLS=$(jq -c '.skills' skills.manifest.json)
          rm skills.manifest.json
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json; do
            [ -f "$f" ] || continue
            tmp=$(mktemp); jq --arg v "$VERSION" '.version = $v' "$f" > "$tmp"; mv "$tmp" "$f"
          done
          tmp=$(mktemp)
          jq --arg v "$VERSION" --argjson s "$SKILLS" \
            '.plugins[0].version = $v | .plugins[0].skills = $s' \
            .claude-plugin/marketplace.json > "$tmp"
          mv "$tmp" .claude-plugin/marketplace.json

      - name: Detect public skills package changes
        id: skills_changes
        run: |
          set -euo pipefail
          cd skills-pkg
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push public skills package
        if: steps.skills_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd skills-pkg
          SHA=$(cd ../source && git rev-parse --short HEAD)
          git config user.name "kolbo-skill-sync[bot]"
          git config user.email "kolbo-skill-sync@users.noreply.github.com"
          git commit -m "chore(skills): regenerate from kolbo-code@${SHA}"
          git push

      - name: Checkout MCP package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zoharvan12/kolbo-mcp
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: mcp

      - name: Mirror canonical tree to MCP package
        run: |
          set -euo pipefail
          SRC=source/packages/opencode/skills/kolbo
          DST=mcp/skill
          SHA=$(cd source && git rev-parse --short HEAD)
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -R "$SRC"/. "$DST"/
          {
            echo "# AUTO-GENERATED — do not edit"
            echo
            echo "This tree is mirrored from kolbo-code@${SHA}, the single source of truth."
            echo "Canonical source: packages/opencode/skills/kolbo/"
            echo "Distribution: .github/workflows/sync-skill-to-plugin.yml"
            echo
            echo "Both 'npx -y @kolbo/mcp@latest skill' and the combined 'install' command deploy it."
          } > "$DST/GENERATED.md"
          diff -qr --exclude=GENERATED.md "$SRC" "$DST"

      - name: Detect MCP bundle changes
        id: mcp_changes
        run: |
          set -euo pipefail
          cd mcp
          git add skill/
          if git diff --cached --quiet -- skill/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.mcp_changes.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Version and validate MCP package
        if: steps.mcp_changes.outputs.changed == 'true'
        id: mcp_version
        env:
          KOLBO_API_KEY: dummy_ci_smoke_test
        run: |
          set -euo pipefail
          cd mcp
          npm version patch --no-git-tag-version
          # A run that dies between publishing and pushing leaves npm and the
          # release tags ahead of main, so the next patch bump lands on a version
          # that already exists and the tag push is rejected. Skip anything
          # already taken on either side rather than colliding with it.
          for _ in $(seq 1 20); do
            NEW=$(node -p "require('./package.json').version")
            if npm view "@kolbo/mcp@${NEW}" version >/dev/null 2>&1 ||
               git ls-remote --exit-code --tags origin "v${NEW}" >/dev/null 2>&1; then
              echo "version ${NEW} already exists on npm or as a tag — bumping past it"
              npm version patch --no-git-tag-version
            else
              break
            fi
          done
          npm ci
          npm run smoke
          npm run check-skill-bundle
          npm run check-install
          NEW=$(node -p "require('./package.json').version")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Push MCP package and release tag
        if: steps.mcp_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd mcp
          NEW=${{ steps.mcp_version.outputs.version }}
          SHA=$(cd ../source && git rev-parse --short HEAD)
          git config user.name "kolbo-skill-sync[bot]"
          git config user.email "kolbo-skill-sync@users.noreply.github.com"
          git add skill/ package.json package-lock.json
          git commit -m "chore(skill): release canonical skill from kolbo-code@${SHA}"
          git tag "v${NEW}"
          git push origin HEAD
          git push origin "v${NEW}"

      - name: Wait for npm publication
        if: steps.mcp_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          NEW=${{ steps.mcp_version.outputs.version }}
          for attempt in $(seq 1 30); do
            if [ "$(npm view "@kolbo/mcp@${NEW}" version 2>/dev/null || true)" = "$NEW" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "@kolbo/mcp@${NEW} was not visible on npm after five minutes" >&2
          exit 1

      - name: Checkout Kolbo API
        if: steps.mcp_changes.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zoharvan12/kolbo-api
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: api

      - name: Update API to published MCP package
        if: steps.mcp_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd api
          NEW=${{ steps.mcp_version.outputs.version }}
          npm install "@kolbo/mcp@${NEW}" --save-exact --ignore-scripts
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "kolbo-skill-sync[bot]"
          git config user.email "kolbo-skill-sync@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(mcp): update to @kolbo/mcp@${NEW}"
          git push
